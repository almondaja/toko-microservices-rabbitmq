services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Buat file .env dari .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Buat file .env dari .env.example}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - toko-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  product-service:
    build: ./product-service
    restart: unless-stopped
    networks:
      - toko-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      PRODUCT_SERVICE_URL: http://product-service:3000
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      product-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - toko-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - toko-network

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:3000
      ORDER_SERVICE_URL: http://order-service:3001
      PRODUCT_DOC_URL: http://product-service:3000/openapi.json
      ORDER_DOC_URL: http://order-service:3001/openapi.json
      API_KEY: ${API_KEY:-praktikum-key}
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - toko-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  toko-network:
    driver: bridge
