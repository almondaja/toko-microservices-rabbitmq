
asyncapi: 2.6.0

info:
  title: Toko Microservices - RabbitMQ Events
  version: 1.0.0
  description: |
    Dokumentasi komunikasi asynchronous antara Order Service
    dan Notification Service menggunakan RabbitMQ.

defaultContentType: application/json

servers:
  rabbitmq:
    url: '{host}:{port}'
    protocol: amqp
    description: RabbitMQ message broker
    variables:
      host:
        default: localhost
      port:
        default: '5672'

channels:
  orders:
    description: Exchange fanout untuk event pesanan.
    publish:
      operationId: receiveOrderCreated
      summary: Menerima event order.created
      description: |
        Notification Service menerima event ketika pesanan berhasil dibuat.
        Exchange orders menggunakan tipe fanout.
      message:
        $ref: '#/components/messages/OrderCreated'

    subscribe:
      operationId: publishOrderCreated
      summary: Mengirim event order.created
      description: |
        Order Service mengirim event setelah pesanan berhasil disimpan.
        Pesan dikirim sebagai persistent message.
      message:
        $ref: '#/components/messages/OrderCreated'

components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: Order Created Event
      summary: Event ketika pesanan baru berhasil dibuat.
      contentType: application/json
      headers:
        type: object
        properties:
          messageId:
            type: string
            example: order-1
      payload:
        $ref: '#/components/schemas/OrderCreatedPayload'

  schemas:
    OrderCreatedPayload:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          const: order.created
          example: order.created
        data:
          $ref: '#/components/schemas/Order'

    Order:
      type: object
      required:
        - id
        - productId
        - productName
        - qty
        - total
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        productName:
          type: string
          example: Keyboard Mekanik
        qty:
          type: integer
          example: 2
        total:
          type: integer
          example: 900000
        createdAt:
          type: string
          format: date-time
          example: '2026-11-11T08:00:00.000Z'
